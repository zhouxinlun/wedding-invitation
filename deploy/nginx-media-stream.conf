# Include only inside the xinni1006.mengmeng.site HTTPS server block.
# Compress text assets; do not recompress the photographs or media.
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_vary on;

# Native MP4/M4A playback reads progressively and keeps HTTP Range support.
# Give this 48 kbps recording a fast ~10-second opening buffer, then send
# at ~4x its playback bitrate so it cannot greedily compete with the HD video.
# This is transport pacing only: the existing recording bytes are unchanged.
location = /web/media/married-life-piano-mobile-v1.m4a {
    try_files $uri =404;
    expires 7d;
    limit_rate_after 64k;
    limit_rate 24k;
}
