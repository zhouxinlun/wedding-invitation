# Include only inside the xinni1006.mengmeng.site HTTPS server block.
# Compress text assets; do not recompress the photographs or media.
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_vary on;

# Native MP4/M4A playback reads progressively and keeps HTTP Range support.
# Give the 12 kbps recording a fast opening buffer, then continue well above
# its playback bitrate while leaving the opening video most of the bandwidth.
# This controls transport pacing; MP4/M4A headers still support incremental reads.
location = /web/media/married-life-piano-300k.m4a {
    try_files $uri =404;
    expires 7d;
    limit_rate_after 16k;
    limit_rate 8k;
}
