# Include inside the wedding site's HTTPS server block only.
# Create /etc/nginx/invitation-amap-secret.conf (root:root, mode 600):
# set $invitation_amap_jscode "YOUR_SECURITY_JS_CODE";
# Never put the actual securityJsCode in the repository or public directory.
location ^~ /_AMapService/ {
    include /etc/nginx/invitation-amap-secret.conf;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($arg_key != e9c27479bd108ea4092a77a3bed700b4) { return 403; }
    set $args "$args&jscode=$invitation_amap_jscode";
    proxy_pass https://restapi.amap.com/;
    proxy_set_header Host restapi.amap.com;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_redirect off;
    # Upstream URLs contain the server-side secret; never record them in logs.
    access_log off;
    error_log /var/log/nginx/invitation-amap-error.log crit;
}
