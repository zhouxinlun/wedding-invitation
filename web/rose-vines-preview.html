<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>玫瑰藤蔓 · 十款设计</title><link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <style>
    body{padding:36px 28px 60px;background:#123d40}
    .vine-review{max-width:1120px;margin:auto}
    .review-nav{display:flex;align-items:center;justify-content:space-between;gap:24px;color:#d7be95;font-size:12px}
    .review-nav a{min-height:44px;display:flex;align-items:center}
    .review-heading{padding:36px 0 30px;border-bottom:1px solid #d7be9538}
    .review-heading h1{font-size:42px;letter-spacing:5px;margin:12px 0;color:#f0d7ae}
    .review-heading p{color:#b9cbbd;font-size:13px;line-height:1.9}
    .vine-catalog{display:grid;grid-template-columns:1fr 1fr;column-gap:52px;row-gap:22px;margin-top:28px}
    .vine-sample{margin:0;padding:10px 0 18px;border-bottom:1px solid #d7be9529;min-width:0}
    .vine-sample figcaption{display:flex;align-items:baseline;gap:15px;letter-spacing:3px;color:#e9cea1}
    .vine-sample span{font:12px Georgia,serif;color:#a89977;letter-spacing:1px}
    .vine-sample strong{font-size:20px;font-weight:400}
    .vine-sample img{display:block;width:100%;height:auto;aspect-ratio:3/1;object-fit:contain;margin-top:8px}
    .review-footer{text-align:center;margin-top:36px;color:#b9cbbd;font-size:12px;letter-spacing:2px}
    @media(max-width:600px){body{padding:20px 22px 40px}.vine-catalog{grid-template-columns:1fr;row-gap:8px}.review-heading{padding-top:20px}.review-heading h1{font-size:30px;letter-spacing:3px}.review-nav{gap:16px;font-size:11px}.vine-sample strong{font-size:18px}}
  </style>
  <script defer src="../miniprogram/shared/rose-vines.js"></script>
  <script defer src="rose-vines-preview.js"></script>
</head>
<body><main class="vine-review">
  <nav class="review-nav"><a href="index.html#album">‹ 返回请柬</a><a href="album-preview.html?group=heart">看看照片之间的效果 ↗</a></nav>
  <header class="review-heading"><p class="eyebrow">ROSES BETWEEN OUR MOMENTS</p><h1 class="serif">花间，十种相逢。</h1><p>暗红玫瑰，细金藤蔓。每一段弯绕，都为下一次心动留白。<br>十款轮换，相邻不重复；再次翻开，仍是熟悉的那一页。</p></header>
  <div class="vine-catalog" aria-label="十款玫瑰藤蔓设计"></div>
  <p class="review-footer">周新沦 & 李小妮 · 2026.10.06</p>
</main></body>
</html>
